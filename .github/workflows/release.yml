# Build installers and publish them
# Run on v* tags or manual dispatch

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Existing release tag, such as v5.0.0'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-2022
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            bundle: nsis
            artifact_name: anti-power-windows
            artifact_path: patcher/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
          - platform: macos-15
            target: universal-apple-darwin
            rust_targets: x86_64-apple-darwin, aarch64-apple-darwin
            bundle: dmg
            artifact_name: anti-power-macos-universal
            artifact_path: patcher/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rust_targets: x86_64-unknown-linux-gnu
            bundle: appimage
            artifact_name: anti-power-linux
            artifact_path: patcher/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        working-directory: patcher
        run: npm ci

      - name: Build Tauri app
        working-directory: patcher
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npm run tauri:build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundle }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  # Publish the installers together
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release-files
          # Windows
          cp artifacts/anti-power-windows/*-setup.exe release-files/anti-power-windows.exe
          # macOS Universal
          cp artifacts/anti-power-macos-universal/*.dmg release-files/anti-power-macos-universal.dmg
          # Linux AppImage
          cp artifacts/anti-power-linux/*.AppImage release-files/anti-power-linux.AppImage

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          body_path: release-notes.md
          draft: false
          prerelease: false
          files: |
            release-files/anti-power-windows.exe
            release-files/anti-power-macos-universal.dmg
            release-files/anti-power-linux.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
