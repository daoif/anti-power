<!doctype html>
<html>

<head>
    <style>
        /* Use the chat text color for table rows */
        #react-app #chat table tbody {
            color: var(--codeium-text-color) !important;
        }

        /* Copy button */
        .custom-copy-btn {
            display: flex;
            align-items: center;
            gap: 0.25rem;
            padding: 2px 6px;
            border: 1px solid var(--vscode-editorWidget-border, transparent);
            border-radius: 4px;
            background: var(--vscode-editorWidget-background, transparent);
            color: var(--vscode-editorWidget-foreground, currentColor);
            font-size: 12px;
            line-height: 1.2;
            transition: opacity 0.12s ease, transform 0.1s ease;
            cursor: pointer;
            opacity: 0.7;
        }

        .custom-copy-btn:hover {
            opacity: 1;
        }

        .custom-copy-btn span {
            opacity: 0.9;
        }

        .custom-copy-btn svg {
            height: 1rem;
            width: 1rem;
        }

        .custom-copy-btn.copied {
            opacity: 1;
            color: #22c55e;
        }

        /* Message copy button */
        .cascade-copy-button {
            position: absolute;
            top: -2px;
            right: 0;
            display: flex;
            align-items: center;
            gap: 0.25rem;
            padding: 2px 6px;
            border: 1px solid var(--vscode-editorWidget-border, transparent);
            border-radius: 4px;
            background: var(--vscode-editorWidget-background, transparent);
            color: var(--vscode-editorWidget-foreground, currentColor);
            font-size: 12px;
            line-height: 1.2;
            opacity: 0;
            transition: opacity 0.12s ease, transform 0.1s ease;
            cursor: pointer;
            z-index: 1;
        }

        [data-cascade-copy-bound='1']:hover .cascade-copy-button,
        [data-cascade-copy-bound='1']:focus-within .cascade-copy-button {
            opacity: 0.7;
        }

        .cascade-copy-button:hover {
            opacity: 1 !important;
        }

        .cascade-copy-button svg {
            height: 1rem;
            width: 1rem;
        }

        .cascade-copy-button span {
            opacity: 0.9;
        }

        .cascade-copy-button.copied {
            color: #22c55e;
            opacity: 1 !important;
        }

        /* Mermaid diagram container */
        .cascade-mermaid-container {
            position: relative;
            margin: 1em 0;
            padding: 1em;
            border-radius: 8px;
            background: var(--vscode-editor-background, #1e1e1e);
            border: 1px solid var(--vscode-editorWidget-border, #454545);
            overflow-x: auto;
        }

        .cascade-mermaid-container svg {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
        }

        .cascade-mermaid-container .cascade-mermaid-copy {
            position: absolute;
            top: 4px;
            right: 4px;
            display: flex;
            align-items: center;
            gap: 0.25rem;
            padding: 2px 6px;
            border: 1px solid var(--vscode-editorWidget-border, transparent);
            border-radius: 4px;
            background: var(--vscode-editorWidget-background, rgba(30, 30, 30, 0.8));
            color: var(--vscode-editorWidget-foreground, currentColor);
            font-size: 12px;
            line-height: 1.2;
            opacity: 0;
            transition: opacity 0.12s ease;
            cursor: pointer;
            z-index: 1;
        }

        .cascade-mermaid-container:hover .cascade-mermaid-copy {
            opacity: 0.7;
        }

        .cascade-mermaid-container .cascade-mermaid-copy:hover {
            opacity: 1 !important;
        }

        .cascade-mermaid-container .cascade-mermaid-copy.copied {
            color: #22c55e;
            opacity: 1 !important;
        }
    </style>
</head>

<body style="margin: 0">
    <div id="react-app" class="react-app-container"></div>

    <script>
        (() => {
            const CONTENT_SELECTOR = '.prose, .prose-sm, [data-in-html-content]';
            const BOUND_ATTR = 'data-cascade-copy-bound';
            const BUTTON_CLASS = 'cascade-copy-button';
            const MATH_ATTR = 'data-cascade-math-rendered';
            const RAW_TEXT_PROP = '__cascadeRawText';
            const MATH_HINT_RE = /\$\$|\\$$|\\$|\\begin\{|\$[^$\n]+\\$/;

            const KATEX_VERSION = '0.16.9';
            const KATEX_BASE =
                window.CASCADE_KATEX_BASE_URL ||
                `https://cdn.jsdelivr.net/npm/katex@${KATEX_VERSION}/dist`;
            const KATEX_CSS_URL = `${KATEX_BASE}/katex.min.css`;
            const KATEX_JS_URL = `${KATEX_BASE}/katex.min.js`;
            const KATEX_AUTO_URL = `${KATEX_BASE}/contrib/auto-render.min.js`;

            const MATHJAX_URL =
                window.CASCADE_MATHJAX_URL ||
                'https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js';

            const MERMAID_VERSION = '10.9.0';
            const MERMAID_URL =
                window.CASCADE_MERMAID_URL ||
                `https://cdn.jsdelivr.net/npm/mermaid@${MERMAID_VERSION}/dist/mermaid.min.js`;
            const MERMAID_ATTR = 'data-cascade-mermaid-rendered';
            const MERMAID_SOURCE_PROP = '__cascadeMermaidSource';

            const COMMON_LANGS = [
                'xml', 'html', 'css', 'javascript', 'typescript', 'python', 'java',
                'json', 'bash', 'shell', 'sql', 'yaml', 'markdown', 'go', 'rust',
                'c', 'cpp', 'csharp', 'php', 'ruby', 'swift', 'kotlin'
            ];

            const COPY_ICON_SVG = `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-4 w-4">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15.666 3.888A2.25 2.25 0 0 0 13.5 2.25h-3c-1.03 0-1.9.693-2.166 1.638m7.332 0c.055.194.084.4.084.612v0a.75.75 0 0 1-.75.75H9.75a.75.75 0 0 1-.75-.75v0c0-.212.03-.418.084-.612m7.332 0c.646.049 1.288.11 1.927.184 1.1.128 1.907 1.077 1.907 2.185V19.5a2.25 2.25 0 0 1-2.25 2.25H6.75A2.25 2.25 0 0 1 4.5 19.5V6.257c0-1.108.806-2.057 1.907-2.185a48.208 48.208 0 0 1 1.927-.184" />
      </svg>`;

            const CHECK_ICON_SVG = `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-4 w-4">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" />
      </svg>`;

            let mathEngine = null;
            let mathReadyPromise = null;

            let mermaidReady = false;
            let mermaidReadyPromise = null;
            let mermaidIdCounter = 0;


            const loadStyle = (href) =>
                new Promise((resolve, reject) => {
                    if (!href) return reject(new Error('Missing stylesheet URL'));
                    if (document.querySelector(`link[href="${href}"]`)) return resolve();
                    const link = document.createElement('link');
                    link.rel = 'stylesheet';
                    link.href = href;
                    link.onload = () => resolve();
                    link.onerror = () => reject(new Error(`Failed to load stylesheet: ${href}`));
                    document.head.appendChild(link);
                });

            const loadScript = (src) =>
                new Promise((resolve, reject) => {
                    if (!src) return reject(new Error('Missing script URL'));
                    if (document.querySelector(`script[src="${src}"]`)) return resolve();
                    const script = document.createElement('script');
                    script.src = src;
                    script.async = true;
                    script.onload = () => resolve();
                    script.onerror = () => reject(new Error(`Failed to load script: ${src}`));
                    document.head.appendChild(script);
                });

            const ensureMathEngine = () => {
                if (mathReadyPromise) return mathReadyPromise;
                mathReadyPromise = (async () => {
                    // Prefer KaTeX when available
                    if (window.katex && window.renderMathInElement) {
                        mathEngine = 'katex';
                        return;
                    }

                    try {
                        await loadStyle(KATEX_CSS_URL);
                        await loadScript(KATEX_JS_URL);
                        await loadScript(KATEX_AUTO_URL);
                        if (window.katex && window.renderMathInElement) {
                            mathEngine = 'katex';
                            return;
                        }
                    } catch (error) {
                        console.warn('[Cascade] KaTeX 加载失败，尝试 MathJax:', error);
                    }

                    // Fall back to MathJax if KaTeX is unavailable
                    if (window.MathJax && window.MathJax.typesetPromise) {
                        mathEngine = 'mathjax';
                        return;
                    }

                    try {
                        window.MathJax = {
                            tex: {
                                inlineMath: [['$', '$'], ['\\(', '\\)']],
                                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                            },
                            options: {
                                skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'],
                                ignoreHtmlClass: 'code-block|line-content|katex|no-math',
                            },
                            startup: { typeset: false },
                        };
                        await loadScript(MATHJAX_URL);
                        if (window.MathJax && window.MathJax.typesetPromise) {
                            await window.MathJax.startup.promise;
                            mathEngine = 'mathjax';
                            return;
                        }
                    } catch (error) {
                        console.warn('[Cascade] MathJax 加载失败:', error);
                    }

                    mathEngine = null;
                })();
                return mathReadyPromise;
            };

            const ensureMermaid = () => {
                if (mermaidReadyPromise) return mermaidReadyPromise;
                mermaidReadyPromise = (async () => {
                    if (window.mermaid && mermaidReady) return;

                    if (window.mermaid) {
                        window.mermaid.initialize({
                            startOnLoad: false,
                            theme: 'dark',
                            themeVariables: {
                                darkMode: true,
                                background: '#1e1e1e',
                                primaryColor: '#4a9eff',
                                primaryTextColor: '#e0e0e0',
                                primaryBorderColor: '#4a9eff',
                                lineColor: '#6a9eff',
                                secondaryColor: '#2d4a6f',
                                tertiaryColor: '#1e3a5f',
                            },
                            securityLevel: 'loose',
                            fontFamily: 'var(--vscode-font-family, "Segoe UI", sans-serif)',
                        });
                        mermaidReady = true;
                        return;
                    }

                    try {
                        await loadScript(MERMAID_URL);
                        if (window.mermaid) {
                            window.mermaid.initialize({
                                startOnLoad: false,
                                theme: 'dark',
                                themeVariables: {
                                    darkMode: true,
                                    background: '#1e1e1e',
                                    primaryColor: '#4a9eff',
                                    primaryTextColor: '#e0e0e0',
                                    primaryBorderColor: '#4a9eff',
                                    lineColor: '#6a9eff',
                                    secondaryColor: '#2d4a6f',
                                    tertiaryColor: '#1e3a5f',
                                },
                                securityLevel: 'loose',
                                fontFamily: 'var(--vscode-font-family, "Segoe UI", sans-serif)',
                            });
                            mermaidReady = true;
                        }
                    } catch (error) {
                        console.warn('[Cascade] Mermaid 加载失败:', error);
                        mermaidReady = false;
                    }
                })();
                return mermaidReadyPromise;
            };

            const isEditable = (el) =>
                !!el.closest('[contenteditable="true"], textarea, input');

            const writeClipboard = async (text) => {
                if (!text) return false;

                // Fall back to execCommand when the Clipboard API is unavailable or rejects
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    try {
                        await navigator.clipboard.writeText(text);
                        return true;
                    } catch {
                    }
                }

                const textArea = document.createElement('textarea');
                textArea.value = text;
                textArea.setAttribute('readonly', '');
                textArea.style.position = 'fixed';
                textArea.style.left = '-9999px';
                textArea.style.top = '-9999px';
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                const ok = document.execCommand('copy');
                document.body.removeChild(textArea);
                return ok;
            };

            // Cache the source text before rendering math
            const captureRawText = (contentEl) => {
                if (!contentEl) return;
                if (contentEl.getAttribute(MATH_ATTR) === '1') return;
                const raw = contentEl.innerText !== undefined
                    ? contentEl.innerText
                    : contentEl.textContent ?? '';
                contentEl[RAW_TEXT_PROP] = raw;
            };

            // Markdown extraction

            const extractTable = (tableEl) => {
                let markdown = '';
                const rows = tableEl.querySelectorAll('tr');

                rows.forEach((row, rowIdx) => {
                    const cells = row.querySelectorAll('th, td');
                    const cellContents = [];

                    cells.forEach(cell => {
                        let cellText = cell.innerText || cell.textContent;
                        cellText = cellText.trim().replace(/\n/g, ' ');
                        cellContents.push(cellText);
                    });

                    markdown += '| ' + cellContents.join(' | ') + ' |\n';

                    // Add the Markdown delimiter row after a table header
                    if (rowIdx === 0 && row.querySelector('th')) {
                        markdown += '| ' + cellContents.map(() => '---').join(' | ') + ' |\n';
                    }
                });

                return markdown;
            };

            const extractLatexFromMath = (mathEl) => {
                // KaTeX stores the LaTeX source in a MathML annotation
                const annotation = mathEl.querySelector('annotation[encoding="application/x-tex"]');
                if (annotation) {
                    const latex = annotation.textContent;
                    const isDisplay = mathEl.closest('.katex-display') !== null;
                    return isDisplay ? `$$${latex}$$` : `$${latex}$`;
                }

                // MathJax exposes the formula on the container's aria-label
                if (mathEl.tagName === 'MJX-CONTAINER') {
                    const ariaLabel = mathEl.getAttribute('aria-label');
                    if (ariaLabel) {
                        const isDisplay = mathEl.getAttribute('display') === 'true' ||
                            mathEl.classList.contains('MathJax_Display');
                        return isDisplay ? `$$${ariaLabel}$$` : `$${ariaLabel}$`;
                    }
                }

                return null;
            };

            const extractFormattedContent = (element, useRawText = true) => {
                const hasCodeBlock = element.querySelector('[class*="language-"], .code-block, [aria-label^="highlighted-code"]');
                const hasTable = element.querySelector('table');
                const hasMathRendered = element.querySelector('.katex, mjx-container, .MathJax');
                const hasMermaid = element.querySelector('.cascade-mermaid-container');

                // Use plain text when the message has no code blocks, tables, or Mermaid diagrams
                if (!hasCodeBlock && !hasTable && !hasMermaid) {
                    if (useRawText && element && element[RAW_TEXT_PROP] !== undefined) {
                        return String(element[RAW_TEXT_PROP]).trim();
                    }
                }

                // Walk the DOM to reconstruct Markdown for structured content
                let result = '';
                const walker = document.createTreeWalker(
                    element,
                    NodeFilter.SHOW_ELEMENT | NodeFilter.SHOW_TEXT,
                    null,
                    false
                );

                let currentNode;
                let skipUntilEndOfBlock = null;

                while (currentNode = walker.nextNode()) {
                    // Skip descendants of blocks already emitted as Markdown
                    if (skipUntilEndOfBlock && skipUntilEndOfBlock.contains(currentNode)) {
                        continue;
                    }
                    skipUntilEndOfBlock = null;

                    if (currentNode.nodeType === Node.ELEMENT_NODE) {
                        const classStr = currentNode.className || '';
                        const classString = typeof classStr === 'string'
                            ? classStr
                            : (classStr.baseVal || '');

                        if (classString.includes('katex') && !classString.includes('katex-display')) {
                            if (currentNode.classList.contains('katex')) {
                                const latex = extractLatexFromMath(currentNode);
                                if (latex) {
                                    result += latex;
                                    skipUntilEndOfBlock = currentNode;
                                    continue;
                                }
                            }
                        }

                        if (classString.includes('katex-display')) {
                            const katexEl = currentNode.querySelector('.katex') || currentNode;
                            const latex = extractLatexFromMath(katexEl);
                            if (latex) {
                                result += '\n' + latex + '\n';
                                skipUntilEndOfBlock = currentNode;
                                continue;
                            }
                        }

                        if (currentNode.tagName === 'MJX-CONTAINER') {
                            const latex = extractLatexFromMath(currentNode);
                            if (latex) {
                                const isDisplay = currentNode.getAttribute('display') === 'true';
                                result += isDisplay ? '\n' + latex + '\n' : latex;
                                skipUntilEndOfBlock = currentNode;
                                continue;
                            }
                        }

                        // Copy the saved Mermaid source in place of the rendered SVG
                        if (classString.includes('cascade-mermaid-container')) {
                            const source = currentNode[MERMAID_SOURCE_PROP];
                            if (source) {
                                result += '\n```mermaid\n' + source + '\n```\n';
                            }
                            skipUntilEndOfBlock = currentNode;
                            continue;
                        }

                        if (currentNode.tagName === 'TABLE') {
                            result += '\n' + extractTable(currentNode) + '\n';
                            skipUntilEndOfBlock = currentNode;
                            continue;
                        }

                        const langMatch = classString.match(/language-(\w+)/);
                        if (langMatch) {
                            const lang = langMatch[1];
                            const codeBlock = currentNode.querySelector('.code-block');
                            if (codeBlock) {
                                const lines = codeBlock.querySelectorAll('.line-content');
                                let codeContent = '';
                                lines.forEach((line, idx) => {
                                    codeContent += line.textContent;
                                    if (idx < lines.length - 1) codeContent += '\n';
                                });
                                result += '\n```' + lang + '\n' + codeContent + '\n```\n';
                                skipUntilEndOfBlock = currentNode;
                            }
                            continue;
                        }

                        const ariaLabel = currentNode.getAttribute('aria-label') || '';
                        if (ariaLabel.startsWith('highlighted-code') && !langMatch) {
                            const codeBlock = currentNode.querySelector('.code-block');
                            if (codeBlock) {
                                const lines = codeBlock.querySelectorAll('.line-content');
                                let codeContent = '';
                                lines.forEach((line, idx) => {
                                    codeContent += line.textContent;
                                    if (idx < lines.length - 1) codeContent += '\n';
                                });
                                result += '\n```\n' + codeContent + '\n```\n';
                                skipUntilEndOfBlock = currentNode;
                            }
                        }
                    } else if (currentNode.nodeType === Node.TEXT_NODE) {
                        const parent = currentNode.parentElement;
                        if (parent) {
                            // Skip rendered math and diagram text that would duplicate the source
                            if (parent.closest('.katex, mjx-container, .MathJax, .cascade-mermaid-container')) {
                                continue;
                            }
                            if (parent.closest('[class*="language-"]')) {
                                continue;
                            }
                            // Skip the language label in the code block header
                            const parentClasses = parent.className || '';
                            const parentClassStr = typeof parentClasses === 'string'
                                ? parentClasses
                                : (parentClasses.baseVal || '');
                            if (parentClassStr.includes('opacity-60') &&
                                parent.closest('pre')?.previousElementSibling) {
                                continue;
                            }
                            // Ignore bare language labels near a code block
                            const textContent = currentNode.textContent.trim().toLowerCase();
                            if (COMMON_LANGS.includes(textContent) &&
                                parent.closest('pre')?.parentElement?.querySelector('[class*="language-"]')) {
                                continue;
                            }
                            // Exclude the injected copy controls from the copied message
                            if (parent.closest('.' + BUTTON_CLASS) ||
                                parent.closest('.custom-copy-btn')) {
                                continue;
                            }
                        }
                        result += currentNode.textContent;
                    }
                }

                return result.trim();
            };

            // Math rendering

            const renderMath = async (contentEl) => {
                if (!contentEl || isEditable(contentEl)) return;

                captureRawText(contentEl);
                const text = contentEl.textContent || '';
                if (!MATH_HINT_RE.test(text)) return;

                if (contentEl.getAttribute(MATH_ATTR) === '1' && !MATH_HINT_RE.test(text)) {
                    return;
                }

                await ensureMathEngine();

                if (mathEngine === 'katex' && window.renderMathInElement) {
                    window.renderMathInElement(contentEl, {
                        delimiters: [
                            { left: '$$', right: '$$', display: true },
                            { left: '\\[', right: '\\]', display: true },
                            { left: '\\(', right: '\\)', display: false },
                            { left: '$', right: '$', display: false },
                        ],
                        ignoredTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'],
                        ignoredClasses: ['code-block', 'line-content', 'katex', 'no-math'],
                        throwOnError: false,
                    });
                    contentEl.setAttribute(MATH_ATTR, '1');
                    return;
                }

                if (mathEngine === 'mathjax' && window.MathJax?.typesetPromise) {
                    await window.MathJax.typesetPromise([contentEl]);
                    contentEl.setAttribute(MATH_ATTR, '1');
                }
            };

            // Mermaid rendering

            const renderMermaid = async (codeBlockContainer) => {
                if (codeBlockContainer.getAttribute(MERMAID_ATTR) === '1') return;

                const classStr = codeBlockContainer.className || '';
                const classString = typeof classStr === 'string' ? classStr : (classStr.baseVal || '');
                if (!classString.includes('language-mermaid')) return;

                const codeBlock = codeBlockContainer.querySelector('.code-block');
                if (!codeBlock) return;

                const lines = codeBlock.querySelectorAll('.line-content');
                let source = '';
                lines.forEach((line, idx) => {
                    source += line.textContent;
                    if (idx < lines.length - 1) source += '\n';
                });

                if (!source.trim()) return;

                // Mark the code block before rendering to prevent duplicate work
                codeBlockContainer.setAttribute(MERMAID_ATTR, '1');

                try {
                    await ensureMermaid();
                    if (!mermaidReady || !window.mermaid) {
                        console.warn('[Cascade] Mermaid 引擎未就绪');
                        return;
                    }

                    const id = `cascade-mermaid-${++mermaidIdCounter}`;

                    const { svg } = await window.mermaid.render(id, source);

                    const container = document.createElement('div');
                    container.className = 'cascade-mermaid-container';
                    container.innerHTML = svg;
                    container[MERMAID_SOURCE_PROP] = source; // Save the diagram source for Markdown copy

                    const copyBtn = document.createElement('button');
                    copyBtn.type = 'button';
                    copyBtn.className = 'cascade-mermaid-copy';
                    copyBtn.innerHTML = `<span>Copy</span>${COPY_ICON_SVG}`;
                    copyBtn.addEventListener('click', async (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        const text = '```mermaid\n' + source + '\n```';
                        const ok = await writeClipboard(text);
                        if (!ok) return;

                        copyBtn.innerHTML = `<span>Copied!</span>${CHECK_ICON_SVG}`;
                        copyBtn.classList.add('copied');
                        setTimeout(() => {
                            copyBtn.innerHTML = `<span>Copy</span>${COPY_ICON_SVG}`;
                            copyBtn.classList.remove('copied');
                        }, 1200);
                    });
                    container.appendChild(copyBtn);

                    codeBlockContainer.replaceWith(container);

                } catch (error) {
                    console.error('[Cascade] Mermaid 渲染失败:', error);
                    // Clear the marker on failure so a later scan can retry
                    codeBlockContainer.removeAttribute(MERMAID_ATTR);
                }
            };

            // Copy controls

            const ensureContentCopyButton = (contentEl) => {
                if (!contentEl || isEditable(contentEl)) return;

                captureRawText(contentEl);
                if (contentEl.getAttribute(BOUND_ATTR) === '1') return;
                contentEl.setAttribute(BOUND_ATTR, '1');

                const pos = getComputedStyle(contentEl).position;
                if (pos === 'static') {
                    contentEl.style.position = 'relative';
                }

                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = BUTTON_CLASS;
                btn.innerHTML = `<span>Copy</span>${COPY_ICON_SVG}`;

                btn.addEventListener('click', async (event) => {
                    event.preventDefault();
                    event.stopPropagation();
                    const text = extractFormattedContent(contentEl, true);
                    const ok = await writeClipboard(text);
                    if (!ok) return;

                    btn.innerHTML = `<span>Copied!</span>${CHECK_ICON_SVG}`;
                    btn.classList.add('copied');
                    setTimeout(() => {
                        btn.innerHTML = `<span>Copy</span>${COPY_ICON_SVG}`;
                        btn.classList.remove('copied');
                    }, 1200);
                });

                contentEl.appendChild(btn);
            };

            const addFeedbackCopyButtons = () => {
                const feedbackContainers = document.querySelectorAll('[data-tooltip-id^="up-"]');

                feedbackContainers.forEach(goodBtn => {
                    const parentContainer = goodBtn.parentElement;
                    if (!parentContainer || parentContainer.querySelector('.custom-copy-btn')) {
                        return;
                    }

                    const copyBtn = document.createElement('div');
                    copyBtn.className = 'custom-copy-btn';
                    copyBtn.innerHTML = `<span>Copy</span>${COPY_ICON_SVG}`;

                    copyBtn.addEventListener('click', async (e) => {
                        e.stopPropagation();

                        let content = '';
                        let searchNode = parentContainer;

                        // Search ancestor containers for the final response
                        for (let i = 0; i < 20; i++) {
                            searchNode = searchNode.parentElement;
                            if (!searchNode) break;

                            const proseElements = searchNode.querySelectorAll('.prose.prose-sm');
                            if (proseElements.length > 0) {
                                const lastProse = proseElements[proseElements.length - 1];
                                content = extractFormattedContent(lastProse);
                                break;
                            }
                        }

                        if (!content) {
                            console.error('[Cascade] 未找到消息内容');
                            return;
                        }

                        const ok = await writeClipboard(content.trim());
                        if (!ok) {
                            console.error('[Cascade] 复制失败');
                            return;
                        }

                        copyBtn.innerHTML = `<span>Copied!</span>${CHECK_ICON_SVG}`;
                        copyBtn.classList.add('copied');

                        setTimeout(() => {
                            copyBtn.innerHTML = `<span>Copy</span>${COPY_ICON_SVG}`;
                            copyBtn.classList.remove('copied');
                        }, 2000);
                    });

                    parentContainer.insertBefore(copyBtn, goodBtn);
                });
            };


            const scan = (root) => {
                if (!root) return;

                root.querySelectorAll(CONTENT_SELECTOR).forEach((node) => {
                    ensureContentCopyButton(node);
                    void renderMath(node);
                });

                root.querySelectorAll('[class*="language-mermaid"]').forEach((node) => {
                    void renderMermaid(node);
                });

                addFeedbackCopyButtons();
            };

            const getRoot = () =>
                document.getElementById('chat') ||
                document.getElementById('react-app') ||
                document.body;

            // Coalesce DOM updates into a single scan
            let scheduled = false;
            const scheduleScan = () => {
                if (scheduled) return;
                scheduled = true;
                requestAnimationFrame(() => {
                    scheduled = false;
                    scan(getRoot());
                });
            };

            const init = () => {
                const root = getRoot();
                scan(root);

                const observer = new MutationObserver(scheduleScan);
                observer.observe(root, { childList: true, subtree: true });
            };

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        })();
    </script>
</body>
