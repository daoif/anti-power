[package]
name = "Anti-Power"
version = "5.0.0"
description = "Local session manager for the Antigravity App and Antigravity CLI"
license = "MIT"
repository = "https://github.com/mikessslxxx/anti-power"
edition = "2021"
rust-version = "1.95"

[lib]
# Windows needs a lib name that differs from the bin name, see https://github.com/rust-lang/cargo/issues/8519
name = "anti_power_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rusqlite = { version = "0.43", features = ["bundled"] }
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
tempfile = "3"
